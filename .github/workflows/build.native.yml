name: Build Aliunde Android TTS Native Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/build.native.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: armeabi-v7a
            artifact: Aliunde.Android.TTS.Native.armv7
          - abi: arm64-v8a
            artifact: Aliunde.Android.TTS.Native.arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Configure
        run: cmake -S native -B "native/build-${{ matrix.abi }}" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI="${{ matrix.abi }}" -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "native/build-${{ matrix.abi }}" --config Release

      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/build-${{ matrix.abi }}/libaliunde.android.tts.so
          if-no-files-found: error
