name: Build Aliunde Android TTS Native Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/build.native.yml'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release
      - name: Upload native bridge
        uses: actions/upload-artifact@v4
        with:
          name: Aliunde.Android.TTS.Native.arm64
          path: native/build/libaliunde.android.tts.so
          if-no-files-found: error
